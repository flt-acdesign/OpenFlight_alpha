<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aircraft Geometry Viewer & GLB Loader</title>
  <link rel="stylesheet" href="styles/style.css">
  <!-- BabylonJS CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
  <!-- The top bar with all controls -->
  <div id="controls">
    <!-- Hide the real JSON file input, use a custom button -->
    <input type="file" id="jsonFileInput" accept=".json" style="display:none;">
    <button id="selectJsonBtn">Open .json</button>

    <!-- REMOVED ToggleTranslucencyBtn from here -->

    <button id="addLiftingSurfaceBtn">Add Lifting Surface</button>
    <button id="addFuselageBtn">Add Fuselage</button>
    <span id="selectedComponentName">Selected: None</span>
    <button id="editComponentBtn" disabled>Edit Selected</button>

    <button id="deleteComponentBtn" disabled>Delete Selected</button>
    <button id="clearAircraft">Clear Aircraft</button>
    <button id="downloadJsonBtn">Download JSON</button>

    <!-- Hide the real GLB file input, use a custom button -->
    <input type="file" id="glbFileInput" accept=".glb" style="display:none;">
    <button id="selectGlbBtn">Open .glb</button>

    <!-- GLB Manipulation Controls -->
    <button id="rotateXBtn">Rotate X 90°</button>
    <button id="rotateYBtn">Rotate Y 90°</button>
    <button id="rotateZBtn">Rotate Z 90°</button>
    <label>GLB Scale:</label>
    <input type="number" id="glbScaleInput" value="1" step="0.1">
    <button id="applyGlbScaleBtn">Apply Scale</button>

    <!-- Box Size Controls -->
    <label>Box Size:</label>
    <input type="number" id="boxSizeInput" value="1" step="0.1" min="0.1">
    <button id="updateBoxSizeBtn">Update Box Size</button>
  </div>
  
  <!-- Canvas for BabylonJS -->
  <canvas id="renderCanvas"></canvas>

  <!-- NEW: Bottom buttons container -->
  <div id="bottomButtons">
    <button id="toggleGround" title="Show/Hide Ground">☀</button>
    <button id="toggleTranslucencyBtn" title="Toggle Translucency">👁</button>
  </div>

  <!-- "Loading 3D Model..." overlay (used for GLB loading feedback) -->
  <div id="loadingText">Loading 3D Model...</div>

  <!-- Show GLB transform info here -->
  <div id="glbTransformSnippet"></div>
  <!-- end snippet container -->

  <!-- Inline modals for Lifting Surfaces & Fuselages -->
  <div id="liftingSurfaceModal" class="modal">
    <div class="modal-content">
      <h3>Add / Edit Lifting Surface</h3>
      <label>Name:</label> <input type="text" id="ls_name" value="wing"><br>
      <label>Mass (kg):</label> <input type="number" id="ls_mass_kg" value="600"><br>
      <label>Root LE (x,y,z):</label> <input type="text" id="ls_root_LE" value="0,0,0"><br>
      <label>AR:</label> <input type="number" step="0.01" id="ls_AR" value="8.33"><br>
      <label>TR:</label> <input type="number" step="0.01" id="ls_TR" value="0.6"><br>
      <label>Mirror:</label> <input type="checkbox" id="ls_mirror"><br>
      <label>Symmetric:</label> <input type="checkbox" id="ls_symmetric" checked><br>
      <label>Dihedral (°):</label> <input type="number" step="0.1" id="ls_dihedral_DEG" value="3"><br>
      <label>Vertical:</label> <input type="checkbox" id="ls_vertical"><br>
      <label>Sweep (°):</label> <input type="number" step="0.1" id="ls_sweep_quarter_chord_DEG" value="15"><br>
      <label>Area (m²):</label> <input type="number" step="0.1" id="ls_surface_area_m2" value="48"><br>
      <label>Oswald:</label> <input type="number" step="0.01" id="ls_Oswald_factor" value="0.7"><br>
      <label>MAC (m):</label> <input type="number" step="0.01" id="ls_mean_aerodynamic_chord_m" value="1.35"><br>
      <label>Stations (η):</label> <input type="text" id="ls_stations_eta" value="0,0.5,1"><br>
      <label>Gyration Pitch:</label> <input type="number" step="0.1" id="ls_radius_of_giration_pitch_m" value="3.5"><br>
      <label>Gyration Yaw:</label> <input type="number" step="0.1" id="ls_radius_of_giration_yaw_m" value="4.0"><br>
      <label>Gyration Roll:</label> <input type="number" step="0.1" id="ls_radius_of_giration_roll_m" value="4.0"><br>
      <label>Pitch Up (°):</label> <input type="number" step="0.1" id="ls_principal_axis_pitch_up_DEG" value="-2"><br>
      <label>CoG (x,y,z):</label> <input type="text" id="ls_CoG_pos_xyz_m" value="0,0,0"><br>
      <label>AC (x,y,z):</label> <input type="text" id="ls_aerodynamic_center_pos_xyz_m" value="2.9,0,0"><br>
      <button id="ls_submit">Submit</button>
      <button id="ls_cancel">Cancel</button>
    </div>
  </div>

  <div id="fuselageModal" class="modal">
    <div class="modal-content">
      <h3>Add / Edit Fuselage</h3>
      <label>Name:</label> <input type="text" id="fus_name" value="fus1"><br>
      <label>Diameter:</label> <input type="number" step="0.1" id="fus_diameter" value="2.5"><br>
      <label>Length:</label> <input type="number" step="0.1" id="fus_length" value="15.0"><br>
      <label>Nose (x,y,z):</label> <input type="text" id="fus_nose_position" value="0,0,0"><br>
      <button id="fus_submit">Submit</button>
      <button id="fus_cancel">Cancel</button>
    </div>
  </div>

  <!-- NEW: GLB Model Edit Modal -->
  <div id="glbModal" class="modal">
    <div class="modal-content">
      <h3>Edit GLB Model Properties</h3>
      <label>Scale Factor:</label> <input type="number" step="0.1" id="glb_scale" value="1.0"><br>
      <label>Rotation X (°):</label> <input type="number" step="1" id="glb_rotation_x" value="0"><br>
      <label>Rotation Y (°):</label> <input type="number" step="1" id="glb_rotation_y" value="0"><br>
      <label>Rotation Z (°):</label> <input type="number" step="1" id="glb_rotation_z" value="0"><br>
      <label>Position X:</label> <input type="number" step="0.1" id="glb_position_x" value="0.0"><br>
      <label>Position Y:</label> <input type="number" step="0.1" id="glb_position_y" value="0.0"><br>
      <label>Position Z:</label> <input type="number" step="0.1" id="glb_position_z" value="0.0"><br>
      <button id="glb_submit">Apply Changes</button>
      <button id="glb_generate_snippet">Generate Code Snippet</button>
      <button id="glb_cancel">Cancel</button>
    </div>
  </div>

  <!-- Scripts (order is important) -->
  <script src="js/⛺_scene_setup/set_up_camera.js"></script>
  <script src="js/⛺_scene_setup/lights_and_shadows.js"></script>
  <script src="js/⛺_scene_setup/ground_axis_sphere.js"></script>
  <script src="js/⛺_scene_setup/babylon-setup.js"></script>
  
  <script src="js/render_aircraft.js"></script>
  <script src="js/load_glb_file.js"></script>
  <script src="js/component-creation.js"></script>
  <script src="js/interaction.js"></script>
  <script src="js/scene-utils.js"></script>
  <script src="js/ui-logic.js"></script>
  <script src="js/glb-editing.js"></script>
</body>
</html>
